<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Мемо-головоломка — 50 уровней</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#21104d,#668fe0);color:#fff;font:16px Arial,sans-serif;user-select:none}.app{max-width:520px;margin:auto;padding:16px;min-height:100vh}.screen{display:none}.screen.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{text-align:center;color:#ffd84a;font-size:27px;font-weight:800;margin:20px 0 8px}.sub{text-align:center;color:#d4d8ff;margin-bottom:24px}.panel,.hud{background:#ffffff14;border:1px solid #ffffff24;border-radius:16px;padding:14px}.hud{display:flex;justify-content:space-around;text-align:center;margin:14px 0}.label{display:block;color:#c8cdf8;font-size:11px;text-transform:uppercase}.value{display:block;color:#ffd84a;font-size:20px;font-weight:bold;margin-top:4px}.btn{width:100%;border:0;border-radius:12px;padding:13px;margin:6px 0;background:linear-gradient(90deg,#ffd84a,#ffad27);color:#27134f;font-weight:bold;font-size:16px;cursor:pointer}.btn.alt{background:#ffffff1c;color:#fff;border:1px solid #ffffff35}.bar{display:flex;gap:7px;margin:10px 0}.chip{flex:1;background:#0003;border:1px solid #ffffff22;border-radius:10px;padding:9px;text-align:center;font-weight:bold}.board{display:grid;gap:7px;max-width:390px;margin:25px auto}.card{aspect-ratio:1;border:1px solid #ffffff35;border-radius:10px;background:linear-gradient(145deg,#5145ac,#30256f);display:grid;place-items:center;font-size:clamp(16px,6vw,29px);cursor:pointer}.card.open,.card.done{background:linear-gradient(145deg,#fff4bd,#ffd95e);color:#251454}.card.done{background:linear-gradient(145deg,#4bd487,#218e58)}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.level{aspect-ratio:1;border:1px solid #ffffff2b;border-radius:12px;background:#ffffff16;color:white;font-weight:bold;font-size:16px}.level.done{background:#299b61}.level.locked{opacity:.35}.level.current{outline:2px solid #ffd84a}.muted{color:#cbd0ff}.center{text-align:center;padding-top:18vh}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.modal>div{max-width:360px;width:100%;background:#30216e;border:1px solid #ffffff35;border-radius:16px;padding:20px;text-align:center}.hidden{display:none!important}
</style>
</head>
<body><main class="app">
<section id="home" class="screen active"><div class="center"><div style="font-size:64px">🧩</div><h1 class="title">МЕМО-ГОЛОВОЛОМКА</h1><div class="sub">50 уровней · найди все пары</div><div class="hud"><div><span class="label">Пройдено</span><span class="value" id="progress">0/50</span></div><div><span class="label">Звёзды</span><span class="value" id="stars">⭐ 0</span></div></div><button class="btn" id="play">▶️ Начать</button><button class="btn alt" id="levelsBtn">🗺️ Уровни</button><button class="btn alt" id="reset">🗑️ Сбросить прогресс</button><div class="bar"><div class="chip">💰 <span id="coins">30</span></div><div class="chip">💡 <span id="hints">3</span></div><div class="chip">❤️ <span id="lives">1</span></div></div></div></section>
<section id="levelsScreen" class="screen"><div class="top"><button class="btn alt" style="width:auto;margin:0" id="backHome">← Назад</button><b>УРОВНИ</b><span></span></div><div class="bar"><div class="chip">💰 <span id="coins2">30</span></div><div class="chip">💡 <span id="hints2">3</span></div><div class="chip">❤️ <span id="lives2">1</span></div></div><div class="hud"><div><span class="label">Пройдено</span><span class="value" id="progress2">0/50</span></div><div><span class="label">Звёзды</span><span class="value" id="stars2">⭐ 0</span></div></div><div class="levels" id="levels"></div></section>
<section id="game" class="screen"><div class="top"><button class="btn alt" style="width:auto;margin:0" id="exit">← Уровни</button><b>УРОВЕНЬ <span id="levelNo">1</span></b><button class="btn alt" style="width:auto;margin:0" id="pause">Ⅱ</button></div><div class="bar"><div class="chip">Ходы<br><span id="moves">0</span></div><div class="chip">Пары<br><span id="pairs">0/3</span></div><div class="chip">Время<br><span id="time">∞</span></div><button class="chip" id="hint">💡 <span id="hintGame">3</span></button></div><div class="board" id="board"></div></section>
<section id="win" class="screen"><div class="center"><div style="font-size:64px">🎉</div><h2 class="title">Уровень пройден!</h2><p id="result" class="muted"></p><button class="btn" id="next">Продолжить</button><button class="btn alt" id="winLevels">К уровням</button></div></section>
</main><div id="modal" class="modal hidden"><div><h2 id="modalTitle"></h2><p id="modalText" class="muted"></p><button class="btn" id="modalOk">Хорошо</button></div></div>
<script>
const TOTAL=50,sets=[['🍎','🍌','🍇','🍊','🍉','🍓','🍒','🥝','🍍','🥭','🍑','🍋','🍈','🫐','🍐','🥥','🍅','🥑'],['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐔','🦉','🐺','🦄'],['⚽','🏀','🏈','⚾','🎾','🏐','🏉','🎱','🏓','🏸','🥊','🎳','🥌','🏹','🥏','🛷','⛳','🎯']];
let p=JSON.parse(localStorage.getItem('memo50.progress')||'null')||{done:0,stars:{},best:{}};let e=JSON.parse(localStorage.getItem('memo50.economy')||'null')||{coins:30,hints:3,lives:1};let level=1,deck=[],open=[],matched=0,moves=0,left=0,timer;
const $=id=>document.getElementById(id),save=()=>{localStorage.setItem('memo50.progress',JSON.stringify(p));localStorage.setItem('memo50.economy',JSON.stringify(e))};
function cfg(n){let pairs=Math.min(3+Math.floor((n-1)/2),18),cards=pairs*2,cols=Math.ceil(Math.sqrt(cards));while(cards%cols)cols++;return{pairs,cols,time:n<3?0:Math.round(18+pairs*4.5+n*.6)}}
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function hud(){let s=Object.values(p.stars).reduce((a,b)=>a+b,0);['progress','progress2'].forEach(id=>$(id).textContent=p.done+'/'+TOTAL);['stars','stars2'].forEach(id=>$(id).textContent='⭐ '+s);['coins','coins2'].forEach(id=>$(id).textContent=e.coins);['hints','hints2','hintGame'].forEach(id=>$(id).textContent=e.hints);['lives','lives2'].forEach(id=>$(id).textContent=e.lives)}
function renderLevels(){hud();$('levels').innerHTML='';for(let i=1;i<=TOTAL;i++){let b=document.createElement('button'),done=i<=p.done,locked=i>p.done+1;b.className='level '+(done?'done ':'')+(locked?'locked':'')+(i===p.done+1?'current':'');b.textContent=done?i+' ⭐'+(p.stars[i]||''):i;if(!locked)b.onclick=()=>start(i);$('levels').append(b)}}
function start(n){clearInterval(timer);level=n;let c=cfg(n);$('levelNo').textContent=n;$('pairs').textContent='0/'+c.pairs;$('moves').textContent='0';$('time').textContent=c.time?' '+c.time:'∞';deck=[...sets[Math.floor((n-1)/17)%sets.length].slice(0,c.pairs),...sets[Math.floor((n-1)/17)%sets.length].slice(0,c.pairs)].sort(()=>Math.random()-.5).map((symbol,i)=>({symbol,open:false,done:false,i}));open=[];matched=moves=0;let grid=$('board');grid.style.gridTemplateColumns='repeat('+c.cols+',1fr)';grid.innerHTML='';deck.forEach(card=>{let el=document.createElement('button');el.className='card';el.onclick=()=>flip(card,el);card.el=el;grid.append(el)});if(c.time){left=c.time;timer=setInterval(()=>{left--;$('time').textContent=left;if(left<=0){clearInterval(timer);if(e.lives){e.lives--;left+=20;timer=setInterval(()=>{left--;$('time').textContent=left},1000);hud()}else{show('Время вышло','Начните уровень заново.')}}},1000)}screen('game');hud()}
function flip(c,el){if(c.open||c.done||open.length===2)return;c.open=true;el.classList.add('open');el.textContent=c.symbol;open.push({c,el});if(open.length<2)return;moves++;$('moves').textContent=moves;let[a,b]=open;if(a.c.symbol===b.c.symbol){a.c.done=b.c.done=true;a.el.classList.add('done');b.el.classList.add('done');matched++;$('pairs').textContent=matched+'/'+cfg(level).pairs;open=[];if(matched===cfg(level).pairs)setTimeout(complete,300)}else setTimeout(()=>{a.c.open=b.c.open=false;a.el.className=b.el.className='card';a.el.textContent=b.el.textContent='';open=[]},650)}
function complete(){clearInterval(timer);let c=cfg(level),s=moves<=c.pairs*2.2?3:moves<=c.pairs*3.2?2:1;p.done=Math.max(p.done,level);p.stars[level]=Math.max(p.stars[level]||0,s);e.coins+=5+s*3;save();$('result').textContent='Ходы: '+moves+' · Награда: '+(5+s*3)+' 💰 · '+'⭐'.repeat(s);screen('win');hud()}
function show(t,m){$('modalTitle').textContent=t;$('modalText').textContent=m;$('modal').classList.remove('hidden')}$('modalOk').onclick=()=>$('modal').classList.add('hidden');
$('play').onclick=()=>start(Math.min(p.done+1,TOTAL));$('levelsBtn').onclick=()=>{renderLevels();screen('levelsScreen')};$('backHome').onclick=()=>screen('home');$('exit').onclick=()=>{clearInterval(timer);renderLevels();screen('levelsScreen')};$('next').onclick=()=>level<TOTAL?start(level+1):(screen('home'),show('Поздравляем!','Вы прошли все 50 уровней 🏆'));$('winLevels').onclick=()=>{renderLevels();screen('levelsScreen')};$('hint').onclick=()=>{if(!e.hints)return show('Нет подсказок','Купите подсказки в магазине или пройдите уровни.');let pair={};deck.filter(x=>!x.done).forEach(x=>(pair[x.symbol]??=[]).push(x));let a=Object.values(pair).find(x=>x.length>1);if(a){e.hints--;a.forEach(x=>{x.open=true;x.el.classList.add('open');x.el.textContent=x.symbol});hud();setTimeout(()=>a.forEach(x=>{if(!x.done){x.open=false;x.el.className='card';x.el.textContent=''}}),1000)}};
$('reset').onclick=()=>{if(confirm('Сбросить прогресс?')){p={done:0,stars:{},best:{}};save();hud()}};$('pause').onclick=()=>{clearInterval(timer);show('Пауза','Нажмите «Хорошо», чтобы продолжить.');if(cfg(level).time)setTimeout(()=>{if($('game').classList.contains('active'))timer=setInterval(()=>{$('time').textContent=--left},1000)},0)};hud();renderLevels();
</script></body></html>
